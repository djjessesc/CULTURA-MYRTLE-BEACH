<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Cultura Myrtle Beach</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a1a}.login-box{background:#fff;padding:2rem;border-radius:16px;width:100%;max-width:360px;box-shadow:var(--shadow)}</style>
</head>
<body>
  <div class="login-box">
    <h1 style="font-size:1.35rem;margin-bottom:1.25rem;text-align:center;">Cultura MB Admin</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash flash-{{c}}">{{m}}</div>{% endfor %}{% endwith %}
    <form method="post">
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" required autofocus></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:0.85rem;"><a href="{{ url_for('home') }}">← Back to site</a></p>
  </div>
</body>
</html>
